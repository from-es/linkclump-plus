<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Same-Domain iframe Child Page</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			font-size: 15px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: #f4fbf7;
			color: #1b4332;
		}
		main {
			padding: 1rem;
		}
		.frame-header {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.5rem;
		}
		.badge {
			padding: 0.2rem 0.5rem;
			font-size: 0.75rem;
			font-weight: bold;
			border-radius: 3px;
			background-color: #d8f3dc;
			color: #1b4332;
			border: 1px solid #74c69d;
		}
		.links {
			margin: 0.75rem 0;
			padding: 0.75rem;
			background-color: #ffffff;
			border: 1px solid #b7e4c7;
			border-radius: 4px;
			list-style: none;
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
		}
		.links li {
			margin: 0;
		}
		.links a {
			display: inline-block;
			padding: 0.35rem 0.65rem;
			background-color: #2d6a4f;
			color: #ffffff;
			text-decoration: none;
			border-radius: 4px;
			font-weight: 500;
		}
		.links a:hover {
			background-color: #1b4332;
		}
		.instruction {
			font-size: 0.85rem;
			color: #40916c;
		}
	</style>
</head>
<body>
<main>
	<div class="frame-header">
		<span class="badge">Same-Origin iframe</span>
		<strong>Inside same-domain iframe (<code>./subpages/inner.html</code>)</strong>
	</div>
	<p class="instruction">Drag-selection started inside this frame will ONLY highlight links in this frame.</p>
	<ul class="links">
		<li><a href="https://www.google.com" target="_blank" rel="noopener">[Child: iframe] Google</a></li>
		<li><a href="https://www.bing.com" target="_blank" rel="noopener">[Child: iframe] Bing</a></li>
		<li><a href="https://www.yahoo.com" target="_blank" rel="noopener">[Child: iframe] Yahoo</a></li>
		<li><a href="https://duckduckgo.com" target="_blank" rel="noopener">[Child: iframe] DuckDuckGo</a></li>
	</ul>
</main>
</body>
</html>
